<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De Stijl — Dutch Grammar Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EE;
  --card:#FFFFFF;
  --ink:#191919;
  --blue:#1D4FC4;
  --red:#D8341C;
  --yellow:#F2B705;
  --line:3px solid var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;line-height:1.55}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{border-bottom:var(--line);background:var(--card)}
.head-in{display:flex;align-items:stretch;gap:0}
.logo-block{display:flex;flex-direction:column;border-right:var(--line)}
.logo-block span{display:block;width:26px;flex:1}
.lb1{background:var(--red)}.lb2{background:var(--yellow)}.lb3{background:var(--blue)}
.head-txt{padding:22px 24px;flex:1}
h1{font-family:'Archivo Black',sans-serif;font-size:clamp(1.5rem,4vw,2.3rem);letter-spacing:-0.5px;line-height:1.05;text-transform:uppercase}
.head-sub{margin-top:6px;font-size:.95rem;color:#444}
.head-count{font-weight:700;color:var(--blue)}
.stat-box{border-left:var(--line);padding:22px 24px;display:flex;flex-direction:column;justify-content:center;min-width:170px}
.stat-box .n{font-family:'Archivo Black',sans-serif;font-size:1.6rem}
.stat-box .l{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#555}

/* ---------- home grid ---------- */
.home-intro{padding:28px 0 6px}
.home-intro h2{font-family:'Archivo Black',sans-serif;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em}
.home-intro p{color:#444;max-width:62ch;margin-top:4px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:22px 0 40px}
.tcard{background:var(--card);border:var(--line);display:flex;flex-direction:column;position:relative;box-shadow:6px 6px 0 var(--ink)}
.tcard .tab{position:absolute;top:-3px;right:-3px;width:34px;height:34px;border:var(--line)}
.tcard h3{font-family:'Archivo Black',sans-serif;font-size:1.05rem;padding:18px 20px 4px;text-transform:uppercase;letter-spacing:.02em;padding-right:52px}
.tcard p{padding:0 20px;font-size:.9rem;color:#444;flex:1}
.tcard .meta{padding:10px 20px 0;font-size:.8rem;color:#666}
.tcard .meta b{color:var(--ink)}
.tcard .acts{display:flex;border-top:var(--line);margin-top:14px}
.tcard .acts button{flex:1;padding:12px;background:var(--card);border:none;font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em}
.tcard .acts button:first-child{border-right:var(--line)}
.tcard .acts button:hover{background:var(--yellow)}
.tcard .acts button.go{background:var(--ink);color:#fff}
.tcard .acts button.go:hover{background:var(--blue)}
.mixcard{background:var(--ink);color:#fff}
.mixcard p{color:#ccc}
.mixcard .meta{color:#aaa}.mixcard .meta b{color:#fff}
.mixcard .acts button{background:var(--ink);color:#fff}
.mixcard .acts button:hover{background:var(--blue)}

/* ---------- topic view ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:20px 0 0;flex-wrap:wrap}
.backbtn{border:var(--line);background:var(--card);padding:8px 16px;font-weight:700;box-shadow:4px 4px 0 var(--ink)}
.backbtn:hover{background:var(--yellow)}
.topic-title{font-family:'Archivo Black',sans-serif;font-size:clamp(1.2rem,3vw,1.7rem);text-transform:uppercase}
.tabs{display:flex;gap:0;margin-top:18px;border-bottom:var(--line)}
.tabs button{padding:10px 22px;border:var(--line);border-bottom:none;background:var(--paper);font-weight:700;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;margin-right:-3px}
.tabs button.on{background:var(--ink);color:#fff}
.pane{padding:24px 0 50px}

/* learn pane */
.learn{max-width:760px}
.learn section{background:var(--card);border:var(--line);padding:22px 24px;margin-bottom:20px;box-shadow:6px 6px 0 var(--ink)}
.learn h4{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:.95rem;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.learn h4::before{content:"";width:14px;height:14px;border:var(--line);display:inline-block}
.learn section.s-what h4::before{background:var(--blue)}
.learn section.s-rules h4::before{background:var(--yellow)}
.learn section.s-diff h4::before{background:var(--red)}
.learn p{margin-bottom:10px;font-size:.96rem}
.learn ul{padding-left:20px}
.learn li{margin-bottom:9px;font-size:.95rem}
.learn .nl{font-weight:700;color:var(--blue)}
.learn .bad{color:var(--red);text-decoration:line-through}
.learn table{border-collapse:collapse;margin:8px 0;width:100%;font-size:.92rem}
.learn th,.learn td{border:2px solid var(--ink);padding:6px 10px;text-align:left}
.learn th{background:var(--yellow);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.startrow{margin-top:4px}
.bigbtn{border:var(--line);background:var(--ink);color:#fff;padding:14px 28px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.95rem;box-shadow:6px 6px 0 rgba(25,25,25,.35)}
.bigbtn:hover{background:var(--blue)}

/* quiz pane */
.quiz{max-width:680px}
.qmeta{display:flex;justify-content:space-between;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.qcard{background:var(--card);border:var(--line);box-shadow:8px 8px 0 var(--ink)}
.qtype{border-bottom:var(--line);padding:8px 20px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;background:var(--yellow)}
.qtext{padding:26px 24px 10px;font-size:1.25rem;font-weight:600;line-height:1.45}
.qtext .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--ink);text-align:center}
.qhint{padding:0 24px 8px;color:#666;font-size:.88rem}
.opts{display:flex;flex-direction:column;gap:12px;padding:16px 24px 24px}
.opts button{border:var(--line);background:var(--paper);padding:13px 16px;font-size:1.05rem;font-weight:600;text-align:left;box-shadow:4px 4px 0 var(--ink);transition:transform .05s}
.opts button:hover{background:var(--yellow)}
.opts button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.opts button.correct{background:var(--blue);color:#fff}
.opts button.wrong{background:var(--red);color:#fff}
.opts button:disabled{cursor:default}
.opts button.dim{opacity:.45}
.feedback{margin:0 24px 24px;border:var(--line);padding:14px 16px;font-size:.93rem;background:var(--paper)}
.feedback .verdict{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;display:block;margin-bottom:6px}
.feedback.ok .verdict{color:var(--blue)}
.feedback.no .verdict{color:var(--red)}
.nextrow{padding:0 24px 24px;display:flex;gap:12px}
.nextrow .bigbtn{flex:1}
.scorebar{display:flex;height:14px;border:var(--line);margin-top:18px;background:var(--card)}
.scorebar .ok{background:var(--blue)}
.scorebar .no{background:var(--red)}
.session{margin-top:10px;font-size:.85rem;color:#555}

footer{border-top:var(--line);background:var(--card);padding:16px 0;margin-top:20px}
footer .wrap{display:flex;justify-content:space-between;font-size:.8rem;color:#555;flex-wrap:wrap;gap:8px}

@media(max-width:640px){
  .stat-box{display:none}
  .qtext{font-size:1.1rem}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div class="logo-block" aria-hidden="true"><span class="lb1"></span><span class="lb2"></span><span class="lb3"></span></div>
    <div class="head-txt">
      <h1>Dutch Grammar Trainer</h1>
      <div class="head-sub">11 grammar topics · plain-English rules · <span class="head-count" id="totalCount">…</span> unique practice questions</div>
    </div>
    <div class="stat-box">
      <span class="n" id="hdrAnswered">0</span>
      <span class="l">answered</span>
      <span class="n" id="hdrAcc" style="margin-top:8px">–</span>
      <span class="l">accuracy</span>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <span>Questions are generated from curated word banks — every noun gender, verb stem and participle is stored explicitly, not guessed.</span>
    <span id="footTotals"></span>
  </div>
</footer>

/* =====================================================

   ===================================================== */
const rnd = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const countable = NOUNS.filter(n=>n.pl);
function adjPairs(){const out=[];for(const n of NOUNS){if(!["p","a","t","l","f"].includes(n.c))continue;for(const a of ADJS){if(a.cats.includes(n.c))out.push([n,a]);}}return out;}
const ADJ_PAIRS = adjPairs();

/* =====================================================
   QUESTION GENERATORS  — each returns {q, hint, options, answer, why}
   ===================================================== */
const GEN = {};

GEN.dehet = () => {
  const n = rnd(NOUNS);
  const why = n.g==="het"
    ? (n.nl.endsWith("je") ? `"${n.nl}" is a diminutive (ends in -je) — all diminutives are het-words.` : `"${n.nl}" (${n.en}) is a het-word. Het-words must simply be memorised — always learn the article with the noun.`)
    : `"${n.nl}" (${n.en}) is a de-word. About 75% of Dutch nouns take "de".`;
  return {q:`___ ${n.nl}`, hint:`(${n.en})`, options:["de","het"], answer:n.g, why};
};

GEN.plural = () => {
  const n = rnd(countable);
  const naiveEn = n.nl+"en", naiveS = n.nl+"s";
  const opts = new Set([n.pl]);
  if(naiveEn!==n.pl) opts.add(naiveEn);
  if(naiveS!==n.pl) opts.add(naiveS);
  const why = n.pl.endsWith("'s") ? `Nouns ending in a single a, o, u, i or y take -'s with an apostrophe: ${n.pl}.`
    : n.pl.endsWith("s") ? `Nouns ending in unstressed -el, -er, -en, -em or -je usually take -s: ${n.pl}.`
    : `The plural of "${n.nl}" is "${n.pl}". Note the spelling: long vowels lose a letter (boom → bomen), short vowels double the consonant (kat → katten), and s/f often become z/v (huis → huizen).`;
  return {q:`één ${n.nl} → twee ___`, hint:`(${n.en})`, options:shuffle([...opts].slice(0,3)), answer:n.pl, why};
};

GEN.adj = () => {
  const [n,a] = rnd(ADJ_PAIRS);
  const ctx = rnd(n.pl?["def","indef","plur"]:["def","indef"]);
  let sentence, answer, why;
  if(ctx==="def"){
    sentence = `${n.g} ___ ${n.nl}`;
    answer = a.e;
    why = `After "de" or "het" the adjective always gets -e: ${n.g} ${a.e} ${n.nl}.`;
  } else if(ctx==="plur"){
    sentence = `de ___ ${n.pl}`;
    answer = a.e;
    why = `Before a plural noun the adjective always gets -e: de ${a.e} ${n.pl}. (All plurals are de-words.)`;
  } else {
    sentence = `een ___ ${n.nl}`;
    if(n.g==="het"){ answer = a.b; why = `THE exception: een + het-word + singular = no -e. So: een ${a.b} ${n.nl}, but HET ${a.e} ${n.nl}.`; }
    else { answer = a.e; why = `"${n.nl}" is a de-word, so the adjective gets -e even after "een": een ${a.e} ${n.nl}. Only een + het-word drops the -e.`; }
  }
  return {q:sentence, hint:`(${a.en} ${n.en})`, options:shuffle([a.b,a.e]), answer, why};
};

GEN.present = () => {
  const v = rnd(VERBS);
  const type = Math.random()<0.15 ? "inv" : "norm";
  if(type==="inv"){
    const q = `___ jij morgen ${v.compl}? (${v.inf})`;
    const correct = cap(v.stem);
    const wrong = cap(v.t)===correct ? cap(v.inf) : cap(v.t);
    return {q, hint:`${v.en} — question with jij`, options:shuffle([correct,wrong]),
      answer:correct, why:`When "jij" comes AFTER the verb (questions, inversion), the -t is dropped: ${cap(v.stem)} jij? — but: Jij ${v.t}.`};
  }
  const s = rnd(SUBJ);
  const forms = {ik:v.stem, t:v.t, pl:v.inf};
  const correct = forms[s.slot];
  const distr = new Set(Object.values(forms));
  distr.delete(correct);
  const pron = s.pron || s.p;
  const why = s.slot==="ik" ? `"ik" takes the bare stem: ik ${v.stem}.`
    : s.slot==="t" ? `"${s.p}" takes stem + t: ${pron} ${v.t}.${v.stem===v.t?" (The stem already ends in -t, so nothing is added.)":""}`
    : `"${s.p}" takes the full infinitive: ${pron} ${v.inf}.`;
  return {q:`${cap(pron)} ___ ${v.compl}. (${v.inf})`, hint:v.en, options:shuffle([correct,...[...distr].slice(0,2)]), answer:correct, why};
};

GEN.perfect = () => {
  const roll = Math.random();
  if(roll < 0.45){ // choose participle
    const v = rnd(PERF);
    const s = rnd(SUBJ);
    const auxSet = AUXF[v.aux];
    const aux = s.slot==="t" && s.p==="jij" ? auxSet.jij : (s.slot==="ik"?auxSet.ik : s.slot==="pl"?auxSet.pl : (s.p==="jij"?auxSet.jij:auxSet.t));
    const pron = s.pron || s.p;
    let wrong;
    if(v.part.endsWith("t")) wrong = v.part.slice(0,-1)+"d";
    else if(v.part.endsWith("d")) wrong = v.part.slice(0,-1)+"t";
    else wrong = "ge"+v.inf;
    if(wrong===v.part) wrong = v.inf;
    return {q:`${cap(pron)} ${aux} ${v.compl} ___. (${v.inf})`, hint:"past participle",
      options:shuffle([v.part,wrong]), answer:v.part,
      why:`The past participle of "${v.inf}" is "${v.part}".`};
  }
  if(roll < 0.8){ // hebben vs zijn
    const v = rnd(PERF);
    const s = rnd(SUBJ);
    const pron = s.pron || s.p;
    const pick = f => s.p==="jij" ? f.jij : f[s.slot==="t"?"t":s.slot];
    const correct = pick(AUXF[v.aux]);
    const wrong = pick(AUXF[v.aux==="hebben"?"zijn":"hebben"]);
    return {q:`${cap(pron)} ___ ${v.compl} ${v.part}.`, hint:`${v.inf} — hebben or zijn?`,
      options:shuffle([correct,wrong]), answer:correct,
      why: v.aux==="zijn" ? `"${v.inf}" describes movement or a change of state, so it takes ZIJN: ${pron} ${correct} ${v.part}.`
        : `"${v.inf}" takes HEBBEN (like most verbs): ${pron} ${correct} ${v.part}. Zijn is only for movement/change-of-state verbs.`};
  }
  // 't kofschip drill
  const regs = PERF.filter(p=>p.part.startsWith("ge")&&(p.part.endsWith("t")||p.part.endsWith("d"))&&!["gekocht","gezegd","gevraagd"].includes(p.part));
  const v = rnd(regs);
  const wrong = v.part.endsWith("t") ? v.part.slice(0,-1)+"d" : v.part.slice(0,-1)+"t";
  return {q:`Past participle of "${v.inf}"?`, hint:"'t kofschip: -t or -d?",
    options:shuffle([v.part,wrong]), answer:v.part,
    why: v.part.endsWith("t") ? `The stem of "${v.inf}" ends in a 't kofschip sound (t, k, f, s, ch, p) → participle ends in -t: ${v.part}.`
      : `The stem of "${v.inf}" does NOT end in a 't kofschip sound → participle ends in -d: ${v.part}.`};
};

GEN.modal = () => {
  if(Math.random()<0.35){ // conjugation
    const m = rnd(MODALS);
    const s = rnd(SUBJ);
    const correct = s.slot==="ik"?m.ik : s.slot==="pl"?m.pl : (s.p==="jij"?m.jij:m.hij);
    const distr = new Set([m.ik,m.jij,m.hij,m.pl]); distr.delete(correct);
    const pron = s.pron||s.p;
    return {q:`${cap(pron)} ___ goed Nederlands spreken. (${m.inf})`, hint:m.en,
      options:shuffle([correct,...[...distr].slice(0,2)]), answer:correct,
      why:`${cap(pron)} ${correct}. Note: with kunnen, mogen, willen and zullen, the hij/zij-form has NO -t (hij kan, hij mag, hij wil, hij zal) — unlike regular verbs.`};
  }
  // structure: modal + infinitive at the end
  const m = rnd(MODALS);
  const v = rnd(VERBS);
  const s = rnd(SUBJ.filter(x=>["ik","t","pl"].includes(x.slot)));
  const mf = s.slot==="ik"?m.ik : s.slot==="pl"?m.pl : (s.p==="jij"?m.jij:m.hij);
  const pron = s.pron||s.p;
  const correct = `${mf} … ${v.inf}`;
  const wrong1 = `${mf} ${v.inf} …`;
  const wrong2 = `${v.inf} … ${mf}`;
  return {q:`${cap(pron)} ___ vandaag ${v.compl} ___. (${m.inf} + ${v.inf})`,
    hint:"where do the two verbs go?",
    options:shuffle([correct,wrong1,wrong2]), answer:correct,
    why:`The modal is conjugated in second position; the other verb goes to the END as an infinitive: ${cap(pron)} ${mf} vandaag ${v.compl} ${v.inf}.`};
};

GEN.wordorder = () => {
  const roll = Math.random();
  if(roll<0.35){ // inversion after fronted time
    const t = rnd(WO_TIME), c = rnd(WO_CLAUSE);
    const correct = `${c.v} ${c.s}`, wrong = `${c.s} ${c.v}`;
    return {q:`${t} ___ ${c.rest}.`, hint:"verb + subject, or subject + verb?",
      options:shuffle([correct,wrong]), answer:correct,
      why:`Dutch is verb-second (V2). "${t}" fills position 1, so the verb must come next and the subject flips behind it: ${t} ${c.v} ${c.s} ${c.rest}.`};
  }
  if(roll<0.65){ // time–manner–place
    const t=rnd(WO_TMP_T), m=rnd(WO_TMP_M), p=rnd(WO_TMP_P);
    const correct=`${t} ${m} ${p}`;
    const wrongs=[`${p} ${t} ${m}`,`${m} ${p} ${t}`];
    return {q:`Ik ga ___.`, hint:"put time, manner and place in the right order",
      options:shuffle([correct,rnd(wrongs)]), answer:correct,
      why:`Dutch order is Time – Manner – Place: Ik ga ${t} ${m} ${p}. (English prefers Place before Time: "I'm going to Amsterdam tomorrow.")`};
  }
  // subordinate clause: verb to the end
  const main=rnd(WO_SUB_MAIN), conj=rnd(WO_SUB_CONJ), pred=rnd(WO_SUB_PRED), s=rnd(WO_SUB_SUBJ);
  const vf = s[pred.v];
  const correct = `${s.p} ${pred.txt} ${vf}`;
  const wrong = `${s.p} ${vf} ${pred.txt}`;
  return {q:`${main} ${conj} ___.`, hint:"word order after "+conj,
    options:shuffle([correct,wrong]), answer:correct,
    why:`After a subordinating conjunction (omdat, als, terwijl, dat…) the verb moves to the very END: ${main.toLowerCase().startsWith("ik")?main:main} ${conj} ${correct}.`};
};

GEN.negation = () => {
  if(Math.random()<0.5){ // geen
    const n = rnd(NOUNS.filter(x=>x.c!=="p"||Math.random()<0.3));
    const s = rnd([["Ik","heb"],["Hij","heeft"],["Zij","heeft"],["Wij","hebben"],["Jullie","hebben"]]);
    return {q:`${s[0]} ${s[1]} ___ ${n.nl}.`, hint:`(${n.en})`,
      options:shuffle(["geen","niet"]), answer:"geen",
      why:`Use GEEN to negate an indefinite noun — it replaces "een" or no article: geen ${n.nl}. (Think: geen = "not a / no".)`};
  }
  const s = rnd(NEG_NIET_SUBJ);
  const t = rnd([
    ()=>({q:`${s.p} ${s.w} ___ op ${rnd(NEG_NIET_DAYS)}.`,why:`Use NIET to negate a verb, adjective, or a definite/prepositional phrase. Here you negate the working itself.`}),
    ()=>{const p=rnd(NOUNS.filter(x=>x.c==="l"));return {q:`${s.p} ${s.g} ___ naar ${p.g==="de"?"de":"het"} ${p.nl}.`,why:`NIET negates prepositional phrases like "naar ${p.g} ${p.nl}". GEEN is only for indefinite nouns.`};},
    ()=>{const a=rnd(ADJS);return {q:`${s.p} ${s.v} de film ___ ${a.b}.`,why:`NIET negates adjectives: niet ${a.b}. GEEN can only stand before an indefinite noun.`};},
    ()=>({q:`Dat is ___ mijn tas.`,why:`"mijn tas" is definite (it has a possessive), so use NIET. GEEN is only for indefinite nouns (een tas / tassen without article).`})
  ])();
  return {q:t.q, hint:"niet or geen?", options:shuffle(["niet","geen"]), answer:"niet", why:t.why};
};

GEN.pronouns = () => {
  if(Math.random()<0.6){ // possessives
    const per = rnd(POSS);
    const n = rnd(NOUNS);
    const correct = n.g==="het" ? per.het : per.de;
    let opts;
    if(per.p==="wij"){ opts = ["ons","onze"]; }
    else {
      const others = POSS.filter(x=>x.p!==per.p).map(x=>n.g==="het"?x.het:x.de);
      opts = [correct, rnd(others.filter(o=>o!==correct))];
    }
    const why = per.p==="wij"
      ? (n.g==="het" ? `"${n.nl}" is a het-word → ONS: ons ${n.nl}. (De-words take onze.)`
                     : `"${n.nl}" is a de-word → ONZE: onze ${n.nl}. (Het-words take ons.)`)
      : `The possessive for "${per.p}" is "${correct}": ${correct} ${n.nl}.`;
    return {q:`Dit is ___ ${n.nl}. (${per.p})`, hint:`(${n.en})`, options:shuffle(opts), answer:correct, why};
  }
  const per = rnd(OBJPRON);
  const tmpl = rnd(OBJ_TEMPL);
  const distr = OBJPRON.filter(x=>x.p!==per.p).map(x=>x.o).filter(o=>o!==per.o);
  const subjForm = per.pron|| per.p.split(" ")[0];
  return {q:tmpl.replace("{}","___")+` (${per.p})`, hint:"object pronoun",
    options:shuffle([per.o,rnd(distr),subjForm!==per.o?subjForm:rnd(distr)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3)),
    answer:per.o, why:`The object form of "${per.p}" is "${per.o}". Subject forms (ik, hij, zij…) can't be used as objects.`};
};

GEN.comparative = () => {
  const a = rnd(COMP);
  const roll = Math.random();
  if(roll<0.4){ // comparative form
    const frames = [
      [`Een auto is ___ dan een fiets.`,"duur"],[`Deze zomer is ___ dan vorige zomer.`,"warm"],
      [`Mijn broer is ___ dan ik.`,"oud"],[`De trein is ___ dan de bus.`,"snel"]
    ];
    const frame = `${rnd(["Deze","Die"])} ${rnd(["auto is","stad is","film is","kamer is"])} ___ dan de andere. (${a.b})`;
    const wrong = a.c===a.b+"er" ? "meer "+a.b : a.b+"er";
    return {q:frame, hint:a.en, options:shuffle([a.c,wrong===a.c?a.b:wrong]), answer:a.c,
      why: a.c==="beter"||a.c==="meer"||a.c==="minder"||a.c==="liever" ? `"${a.b}" is irregular: ${a.b} – ${a.c} – ${a.s}. Learn these by heart.`
        : a.b.endsWith("r") ? `Adjectives ending in -r add -der: ${a.b} → ${a.c}.`
        : `Dutch almost always uses -er, even for long adjectives (no "more"): ${a.b} → ${a.c}.`};
  }
  if(roll<0.7){ // superlative attributive
    const nouns = ["dag","stad","boek","huis","film"];
    const pick = rnd(nouns);
    const nObj = NOUNS.find(n=>n.nl===pick);
    return {q:`Dit is ${nObj.g==="het"?"het":"de"} ___ ${nObj.nl} van allemaal. (${a.b})`, hint:a.en,
      options:shuffle([a.s+"e",a.c,a.s]), answer:a.s+"e",
      why:`Superlative before a noun: ${a.b} → ${a.s} + e: ${nObj.g} ${a.s}e ${nObj.nl}. (${a.c==="beter"?"Irregular: goed – beter – best.":""}The adjective -e rule still applies.)`};
  }
  // dan vs als
  return {q:`Deze koffie is ${a.c} ___ die thee.`, hint:"than = ?",
    options:shuffle(["dan","als"]), answer:"dan",
    why:`After a comparative use DAN: ${a.c} dan. "Als" is used for equality: net zo ${a.b} als.`};
};

GEN.separable = () => {
  const v = rnd(SEP);
  const roll = Math.random();
  const s = rnd(SUBJ.filter(x=>["ik","t","pl"].includes(x.slot)));
  const pron = s.pron||s.p;
  if(roll<0.4){ // present split
    const vf = s.slot==="ik"?v.stem : s.slot==="pl"?null : v.t;
    const conj = s.slot==="pl" ? v.inf.replace(v.part,"") : vf; // plural: full verb minus particle? no—use inf split
    const verbForm = s.slot==="ik"?v.stem : s.slot==="t"?v.t : v.inf.slice(v.part.length);
    const correct = `${verbForm} … ${v.part}`;
    const wrong = `${v.part}${verbForm} …`;
    return {q:`${cap(pron)} ___ ${v.compl} ___. (${v.inf})`, hint:v.en,
      options:shuffle([correct,wrong]), answer:correct,
      why:`In a main clause a separable verb SPLITS: the verb is conjugated in position 2, the particle goes to the end: ${cap(pron)} ${verbForm} ${v.compl} ${v.part}.`};
  }
  if(roll<0.7){ // participle
    const wrong = "ge"+v.part+v.pp.slice(v.part.length+2); // ge + particle + rest → geopstaan style
    const wrong2 = "ge" + v.pp.replace("ge","");
    const aux = s.slot==="ik"?AUXF[v.aux].ik : s.slot==="t"?(s.p==="jij"?AUXF[v.aux].jij:AUXF[v.aux].t) : AUXF[v.aux].pl;
    return {q:`${cap(pron)} ${aux} ${v.compl} ___. (${v.inf})`, hint:"past participle of a separable verb",
      options:shuffle([v.pp, wrong2===v.pp?wrong:wrong2]), answer:v.pp,
      why:`With separable verbs, GE goes BETWEEN the particle and the verb: ${v.part} + ge + …: ${v.pp}.`};
  }
  // subordinate clause: stays together
  const verbForm = s.slot==="ik"?v.part+v.stem : s.slot==="t"?v.part+v.t : v.inf;
  const wrong = s.slot==="pl" ? `${v.inf.slice(v.part.length)} … ${v.part}` : `${s.slot==="ik"?v.stem:v.t} … ${v.part}`;
  return {q:`…omdat ${pron} elke dag ___. (${v.inf})`, hint:"subordinate clause",
    options:shuffle([verbForm, s.slot==="ik"?v.stem+" "+v.part:v.t+" "+v.part]), answer:verbForm,
    why:`In a subordinate clause the verb goes to the end and the separable verb REJOINS as one word: …omdat ${pron} elke dag ${verbForm}.`};
};

/* =====================================================
   QUESTION COUNTS (real combination counts per generator)
   ===================================================== */
function counts(){
  const c = {};
  c.dehet = NOUNS.length;                                        // 1 per noun
  c.plural = countable.length;
  c.adj = ADJ_PAIRS.reduce((s,[n])=>s+(n.pl?3:2),0);             // 3 contexts per pair
  c.present = VERBS.length*SUBJ.length + VERBS.length;           // + inversion type
  const regs = PERF.filter(p=>p.part.startsWith("ge")&&(p.part.endsWith("t")||p.part.endsWith("d"))).length;
  c.perfect = PERF.length*SUBJ.length*2 + regs;                  // participle + aux + kofschip
  c.modal = MODALS.length*SUBJ.length + MODALS.length*VERBS.length*6;
  c.wordorder = WO_TIME.length*WO_CLAUSE.length + WO_TMP_T.length*WO_TMP_M.length*WO_TMP_P.length
              + WO_SUB_MAIN.length*WO_SUB_CONJ.length*WO_SUB_PRED.length*WO_SUB_SUBJ.length;
  c.negation = NOUNS.length*5 + NEG_NIET_SUBJ.length*(NEG_NIET_DAYS.length + NOUNS.filter(x=>x.c==="l").length + ADJS.length + 1);
  c.pronouns = POSS.length*NOUNS.length + OBJPRON.length*OBJ_TEMPL.length;
  c.comparative = COMP.length*(8+5+1);
  c.separable = SEP.length*6*3;
  return c;
}

/* =====================================================
   TOPIC DEFINITIONS (explanations in simple English)
   ===================================================== */
const TOPICS = [
{id:"dehet",color:"var(--red)",title:"De & Het",blurb:"The two Dutch words for “the” — and why picking the right one matters for everything else.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>English has one word for “the”. Dutch has two: <span class="nl">de</span> and <span class="nl">het</span>. Every noun belongs to one of the two groups, and you simply have to learn which — there is no meaning difference, it's just the noun's “gender”.</p>
<p><span class="nl">de man</span> (the man) · <span class="nl">de vrouw</span> (the woman) · <span class="nl">het huis</span> (the house) · <span class="nl">het boek</span> (the book)</p></section>
<section class="s-rules"><h4>The rules</h4>
<ul>
<li>About <b>75% of nouns are de-words</b>. If you must guess, guess <span class="nl">de</span>.</li>
<li><b>All plurals take de</b> — even plurals of het-words: <span class="nl">het huis → de huizen</span>.</li>
<li><b>All diminutives (-je) take het</b>: <span class="nl">het meisje, het huisje, het biertje</span> — no exceptions.</li>
<li>People and professions are usually de-words (<span class="nl">de dokter, de leraar</span>) — but <span class="nl">het kind, het meisje</span> are het.</li>
<li>Words for languages, metals, sports and words starting with ge-, be-, ver- + no plural are often het-words: <span class="nl">het Nederlands, het goud, het gesprek</span>.</li>
<li>The honest rule: <b>always learn a noun together with its article.</b> Learn “de tafel”, never just “tafel”.</li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English “the”:</b> English never makes you choose; Dutch does, and the choice ripples outward — it decides adjective endings (<span class="nl">een groot huis</span> vs <span class="nl">een grote man</span>), which demonstrative you use (<span class="nl">dit/dat</span> for het-words, <span class="nl">deze/die</span> for de-words) and even “our” (<span class="nl">ons huis</span> vs <span class="nl">onze auto</span>).</p>
<p><b>vs German:</b> German has three genders (der/die/das) and four cases. Dutch collapsed masculine and feminine into one “de” group and dropped the cases. If you know German: der + die → de, das → het (usually).</p></section>`},

{id:"plural",color:"var(--blue)",title:"Plurals",blurb:"-en or -s? Plus the spelling changes that trip everyone up.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>Dutch makes plurals with <b>-en</b> or <b>-s</b>. English almost always uses -s; Dutch mostly uses <b>-en</b>, and reserves -s for specific endings.</p></section>
<section class="s-rules"><h4>The rules</h4>
<ul>
<li><b>Default: add -en</b> → <span class="nl">boek → boeken, hond → honden</span>.</li>
<li><b>Add -s</b> after unstressed <b>-el, -er, -en, -em, -je</b> and many loanwords → <span class="nl">tafel → tafels, computer → computers, meisje → meisjes</span>.</li>
<li><b>Add -'s (apostrophe!)</b> after a single a, o, u, i, y → <span class="nl">auto → auto's, foto → foto's, baby → baby's</span>.</li>
<li>Spelling changes with -en:
 <ul>
 <li>Long vowel loses one letter: <span class="nl">boom → bomen, uur → uren</span></li>
 <li>Short vowel doubles the consonant: <span class="nl">kat → katten, bus → bussen</span></li>
 <li>s → z and f → v: <span class="nl">huis → huizen, brief → brieven</span></li>
 </ul></li>
<li>Irregulars to memorise: <span class="nl">kind → kinderen, ei → eieren, stad → steden, schip → schepen, museum → musea</span>.</li>
<li>All plurals are <b>de-words</b>.</li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English plurals:</b> English defaults to -s; Dutch defaults to -en. English never respells the word (cat → cats); Dutch respells constantly (kat → katten) because Dutch spelling exists to protect vowel length. That same spelling system runs through verb conjugation too — master it here and you get verbs half for free.</p></section>`},

{id:"adj",color:"var(--yellow)",title:"Adjective Endings",blurb:"One rule, one famous exception: when does the adjective get -e?",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>When an adjective stands before a noun, Dutch usually adds <b>-e</b>: <span class="nl">de grote man, een mooie stad</span>. There is exactly one situation where it doesn't.</p></section>
<section class="s-rules"><h4>The rules</h4>
<ul>
<li><b>Default: adjective + e</b> → <span class="nl">de grote tafel, het grote huis, de grote huizen, een grote man</span>.</li>
<li><b>The one exception:</b> <span class="nl">een</span> (or geen / no article) + <b>het-word</b> + <b>singular</b> → NO -e: <span class="nl">een groot huis, een mooi boek</span>.</li>
<li>Same word, both forms: <span class="nl">HET grote huis</span> but <span class="nl">EEN groot huis</span>.</li>
<li>Spelling changes when adding -e (same system as plurals): <span class="nl">groot → grote, dik → dikke, boos → boze, lief → lieve, wit → witte</span>.</li>
<li>After the noun (predicative), never an ending: <span class="nl">Het huis is groot.</span></li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English:</b> English adjectives never change (“a big house / the big house”). In Dutch the article system and the adjective system are welded together — you cannot get adjectives right without knowing de/het. That's the real reason to drill articles.</p>
<p><b>vs German:</b> German has three full tables of adjective endings. Dutch boiled it down to “-e, except een + het-word singular”. Be grateful.</p></section>`},

{id:"present",color:"var(--blue)",title:"Present Tense",blurb:"Stem, stem+t, infinitive — and the jij-flip that drops the t.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>Dutch present tense has only three forms. Find the <b>stem</b> (roughly: infinitive minus -en, with spelling fixed) and build:</p>
<table><tr><th>Who</th><th>Form</th><th>Example (werken)</th></tr>
<tr><td>ik</td><td>stem</td><td>ik werk</td></tr>
<tr><td>jij / hij / zij / u</td><td>stem + t</td><td>jij werkt</td></tr>
<tr><td>wij / jullie / zij</td><td>infinitive</td><td>wij werken</td></tr></table></section>
<section class="s-rules"><h4>The rules</h4>
<ul>
<li>Stem spelling follows the vowel-protection rules: <span class="nl">maken → ik maak</span>, <span class="nl">wonen → ik woon</span>, <span class="nl">bellen → ik bel</span>, <span class="nl">reizen → ik reis</span> (z→s), <span class="nl">schrijven → ik schrijf</span> (v→f).</li>
<li>If the stem already ends in -t, add nothing: <span class="nl">hij praat, zij wacht</span>. Never -tt.</li>
<li><b>The jij-flip:</b> when jij comes AFTER the verb (questions), drop the -t: <span class="nl">Jij werkt → Werk jij?</span> This only happens with jij, never with hij/zij/u.</li>
<li><span class="nl">u</span> always takes stem + t, even in questions: <span class="nl">Werkt u?</span></li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English present:</b> English only marks he/she/it (-s). Dutch marks jij AND hij with -t, and uses the full infinitive for all plurals. And English never does anything like the jij-flip.</p>
<p><b>vs Dutch modal verbs:</b> regular verbs give hij a -t (hij werkt); modals don't (hij kan, hij wil). Mixing these up is one of the most common learner errors — see the Modal Verbs topic.</p></section>`},

{id:"perfect",color:"var(--red)",title:"Perfect Tense",blurb:"hebben/zijn + participle, the 't kofschip trick, and why Dutch uses it where English uses simple past.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>The perfect (<span class="nl">ik heb gewerkt</span> = I worked / I have worked) is <b>the</b> spoken past tense in Dutch. Structure: <b>hebben or zijn</b> in position 2 + <b>past participle at the end</b>.</p>
<p><span class="nl">Ik heb gisteren de hele dag <b>gewerkt</b>.</span></p></section>
<section class="s-rules"><h4>The rules</h4>
<ul>
<li><b>Regular participles: ge + stem + t or d.</b> Choose -t if the stem ends in a <b>'t kofschip</b> sound (t, k, f, s, ch, p): <span class="nl">werken → gewerkt, koken → gekookt</span>. Otherwise -d: <span class="nl">wonen → gewoond, bellen → gebeld</span>.</li>
<li>Strong verbs change their vowel and end in -en — memorise them: <span class="nl">drinken → gedronken, eten → gegeten, schrijven → geschreven</span>.</li>
<li>Verbs starting with be-, ge-, ver-, ont-, her- get <b>no ge-</b>: <span class="nl">betalen → betaald, vertrekken → vertrokken</span>.</li>
<li><b>hebben or zijn?</b> Most verbs take hebben. Take <b>zijn</b> for movement to a destination and change of state: <span class="nl">gaan, komen, blijven, worden, beginnen, vertrekken, vallen, verhuizen</span> — and <span class="nl">zijn</span> itself (<span class="nl">ik ben geweest</span>).</li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English present perfect:</b> the form looks identical (“have worked”) but the usage is different. English “I have worked yesterday” is wrong; Dutch <span class="nl">Ik heb gisteren gewerkt</span> is exactly what you say. Dutch uses the perfect for finished past events in conversation.</p>
<p><b>vs Dutch simple past (ik werkte):</b> the simple past is mainly for written stories and descriptions of ongoing past situations. When in doubt while speaking: use the perfect.</p></section>`},

{id:"modal",color:"var(--yellow)",title:"Modal Verbs",blurb:"kunnen, moeten, mogen, willen, zullen — irregular forms plus the infinitive-to-the-end rule.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>Five helper verbs that express ability, obligation, permission, desire and future: <span class="nl">kunnen</span> (can), <span class="nl">moeten</span> (must), <span class="nl">mogen</span> (may), <span class="nl">willen</span> (want), <span class="nl">zullen</span> (will/shall).</p></section>
<section class="s-rules"><h4>The rules</h4>
<table><tr><th></th><th>ik</th><th>jij</th><th>hij/zij</th><th>wij/jullie/zij</th></tr>
<tr><td>kunnen</td><td>kan</td><td>kunt</td><td>kan</td><td>kunnen</td></tr>
<tr><td>moeten</td><td>moet</td><td>moet</td><td>moet</td><td>moeten</td></tr>
<tr><td>mogen</td><td>mag</td><td>mag</td><td>mag</td><td>mogen</td></tr>
<tr><td>willen</td><td>wil</td><td>wilt</td><td>wil</td><td>willen</td></tr>
<tr><td>zullen</td><td>zal</td><td>zult</td><td>zal</td><td>zullen</td></tr></table>
<ul>
<li><b>No -t for hij/zij</b> with kunnen, mogen, willen, zullen: <span class="nl">hij kan, zij wil</span> — this is where they break the normal pattern.</li>
<li><b>The other verb goes to the END as an infinitive:</b> <span class="nl">Ik <b>kan</b> morgen niet <b>komen</b>. Hij <b>moet</b> vandaag de rekening <b>betalen</b>.</span></li>
<li>Everything else (time, objects, negation) sits between the two verbs.</li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs regular Dutch verbs:</b> regular verbs put -t on hij (hij werkt); most modals don't (hij kan). Regular verbs stand alone; modals send a second verb to the end of the sentence — a mini-preview of Dutch verb-final word order.</p>
<p><b>vs English modals:</b> English modals sit next to their verb (“I can come tomorrow”). Dutch splits them across the whole sentence (“Ik kan morgen komen”). Resist the urge to keep the verbs together.</p></section>`},

{id:"wordorder",color:"var(--red)",title:"Word Order",blurb:"Verb-second, inversion, Time–Manner–Place, and why 'omdat' throws the verb to the end.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>Dutch word order runs on one iron law: in a main clause, <b>the conjugated verb is always the second element</b> (V2). Whatever fills position one — subject, time, place — the verb comes next.</p></section>
<section class="s-rules"><h4>The rules</h4>
<ul>
<li><b>V2 + inversion:</b> if anything other than the subject starts the sentence, subject and verb flip: <span class="nl">Ik ga morgen naar school → <b>Morgen ga ik</b> naar school.</span> Never <span class="bad">Morgen ik ga</span>.</li>
<li><b>Time – Manner – Place:</b> <span class="nl">Ik ga <b>morgen</b> <b>met de trein</b> <b>naar Amsterdam</b>.</span> English does the reverse (Place before Time).</li>
<li><b>Subordinate clauses are verb-final:</b> after <span class="nl">omdat, als, terwijl, dat, hoewel</span>… the verb moves to the very end: <span class="nl">Ik blijf thuis <b>omdat ik ziek ben</b>.</span> Never <span class="bad">omdat ik ben ziek</span>.</li>
<li>Other verb forms (infinitives, participles) pile up at the end of the main clause too: <span class="nl">Ik heb gisteren een boek <b>gekocht</b>.</span></li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English SVO:</b> English keeps subject-verb-object no matter what starts the sentence (“Tomorrow I go…”). Dutch demands the flip (“Morgen ga ik…”). This inversion is the single most reliable marker of non-native Dutch — drill it until it's automatic.</p>
<p><b>Main clause vs subordinate clause:</b> two different systems inside one language. Main clause: verb second. Subordinate clause: verb last. The conjunction decides which system you're in — <span class="nl">want</span> (coordinating) keeps V2, <span class="nl">omdat</span> (subordinating) forces verb-final, even though both mean “because”.</p></section>`},

{id:"negation",color:"var(--blue)",title:"Niet vs Geen",blurb:"English has one 'not'. Dutch has two, and the noun decides.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>Dutch negates with two different words. <span class="nl">geen</span> negates <b>indefinite nouns</b>; <span class="nl">niet</span> negates <b>everything else</b>.</p></section>
<section class="s-rules"><h4>The rules</h4>
<ul>
<li><b>geen</b> replaces <span class="nl">een</span> or a missing article: <span class="nl">Ik heb een auto → Ik heb <b>geen</b> auto. Wij drinken koffie → Wij drinken <b>geen</b> koffie.</span></li>
<li><b>niet</b> negates verbs, adjectives, adverbs and definite things: <span class="nl">Ik werk <b>niet</b>. De film is <b>niet</b> leuk. Dat is <b>niet</b> mijn tas. Ik ga <b>niet</b> naar het feest.</span></li>
<li>Quick test: could you put “a / any” in front of the noun in English? Then use geen. (“I don't have <i>a</i> car” → geen auto.)</li>
<li>Position of niet: usually towards the end, but before adjectives, prepositions and the sentence-final verb parts: <span class="nl">Ik heb het boek <b>niet</b> gelezen.</span></li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English “not / no”:</b> English “no” + noun (“I have no money”) maps to geen; English “not” maps to niet — but English usually says “don't have a”, which hides the distinction. Dutch forces you to decide on every sentence.</p>
<p><b>vs each other:</b> the trap is definite nouns: <span class="nl">geen</span> can never stand before <span class="nl">de/het/mijn/deze</span>. “Not my bag” = <span class="nl">niet mijn tas</span>, never <span class="bad">geen mijn tas</span>.</p></section>`},

{id:"pronouns",color:"var(--yellow)",title:"Pronouns & Possessives",blurb:"mij vs ik, ons vs onze — the forms English merges and Dutch keeps apart.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>Dutch pronouns come in sets: subject (<span class="nl">ik, jij, hij…</span>), object (<span class="nl">mij, jou, hem…</span>) and possessive (<span class="nl">mijn, jouw, zijn…</span>).</p></section>
<section class="s-rules"><h4>The rules</h4>
<table><tr><th>Subject</th><th>Object</th><th>Possessive</th></tr>
<tr><td>ik</td><td>mij (me)</td><td>mijn</td></tr>
<tr><td>jij</td><td>jou (je)</td><td>jouw (je)</td></tr>
<tr><td>hij</td><td>hem</td><td>zijn</td></tr>
<tr><td>zij (she)</td><td>haar</td><td>haar</td></tr>
<tr><td>u</td><td>u</td><td>uw</td></tr>
<tr><td>wij</td><td>ons</td><td>ons / onze</td></tr>
<tr><td>jullie</td><td>jullie</td><td>jullie</td></tr>
<tr><td>zij (they)</td><td>hen / hun / ze</td><td>hun</td></tr></table>
<ul>
<li><b>ons vs onze:</b> the only possessive that changes with the noun. Het-words take <span class="nl">ons</span> (<span class="nl">ons huis</span>), de-words take <span class="nl">onze</span> (<span class="nl">onze auto</span>). All plurals: onze.</li>
<li><span class="nl">jouw</span> (possessive, “your”) vs <span class="nl">jou</span> (object, “you”) — one letter, different job.</li>
<li>Stressed vs unstressed: <span class="nl">jij/je, zij/ze, wij/we, mijn/m'n</span>. Use the full form for emphasis or contrast.</li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English:</b> English “you/your” covers singular, plural and formal. Dutch splits it three ways: <span class="nl">jij/jou/jouw</span>, <span class="nl">jullie</span>, and formal <span class="nl">u/uw</span>. And English “our” never changes — Dutch <span class="nl">ons/onze</span> depends on de/het, which is yet another reason to learn articles properly.</p></section>`},

{id:"comparative",color:"var(--red)",title:"Comparatives & Superlatives",blurb:"-er and -st for everything (yes, even long words), plus dan vs als.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>Comparing things: <span class="nl">groot → groter → grootst</span> (big → bigger → biggest). Dutch uses endings for nearly all adjectives, long or short.</p></section>
<section class="s-rules"><h4>The rules</h4>
<ul>
<li><b>Comparative: + er</b> → <span class="nl">kleiner, mooier, interessanter</span>. Dutch does NOT use “more” the way English does.</li>
<li>Adjectives ending in <b>-r</b> add <b>-der</b>: <span class="nl">duur → duurder, lekker → lekkerder, ver → verder</span>.</li>
<li><b>Superlative: + st</b> → <span class="nl">kleinst, mooist</span>. Before a noun it also gets the adjective -e: <span class="nl">de kleinste stad, het mooiste huis</span>.</li>
<li><b>Irregulars:</b> <span class="nl">goed – beter – best</span>, <span class="nl">veel – meer – meest</span>, <span class="nl">weinig – minder – minst</span>, <span class="nl">graag – liever – liefst</span>.</li>
<li><b>dan vs als:</b> comparison of difference uses <span class="nl">dan</span> (<span class="nl">groter dan</span>); equality uses <span class="nl">als</span> (<span class="nl">net zo groot als</span>).</li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English:</b> English switches to “more/most” for long adjectives (“more interesting”). Dutch keeps the ending: <span class="nl">interessanter</span>. Saying <span class="bad">meer interessant</span> is a classic English-speaker error.</p>
<p><b>vs ordinary adjectives:</b> comparatives and superlatives still follow the normal adjective -e rules before a noun: <span class="nl">een grotere stad, de grootste stad</span>. Two systems stacked on top of each other.</p></section>`},

{id:"separable",color:"var(--blue)",title:"Separable Verbs",blurb:"opstaan, meenemen, uitnodigen — verbs that split in two and reunite.",
learn:`
<section class="s-what"><h4>What it is</h4>
<p>Many Dutch verbs are built from a particle + verb: <span class="nl">op + staan = opstaan</span> (to get up). In a main clause they <b>split</b>: the verb is conjugated normally, the particle flies to the end of the sentence.</p>
<p><span class="nl">Ik <b>sta</b> elke dag om zeven uur <b>op</b>.</span></p></section>
<section class="s-rules"><h4>The rules</h4>
<ul>
<li><b>Main clause: split.</b> Verb in position 2, particle at the end: <span class="nl">Zij <b>nodigt</b> de buren <b>uit</b>.</span></li>
<li><b>Subordinate clause: rejoin.</b> The whole verb goes to the end in one piece: <span class="nl">…omdat ik om zeven uur <b>opsta</b>.</span></li>
<li><b>Past participle: ge- goes in the middle.</b> Particle + ge + participle: <span class="nl">opgestaan, uitgenodigd, meegenomen</span>. Never <span class="bad">geopstaan</span>.</li>
<li><b>With a modal: rejoin as infinitive at the end:</b> <span class="nl">Ik moet vroeg <b>opstaan</b>.</span></li>
<li>How to spot one: the stress is on the particle (ÓPstaan). Inseparable prefixes (be-, ver-, ont-…) are unstressed and never split.</li>
</ul></section>
<section class="s-diff"><h4>How it differs from similar grammar</h4>
<p><b>vs English phrasal verbs:</b> English “pick up” can split too (“pick it up”), but English never glues the parts back together or inserts anything inside the verb. Dutch does both: <span class="nl">opsta</span> (subordinate clause), <span class="nl">opgestaan</span> (ge- inside).</p>
<p><b>vs inseparable prefix verbs:</b> <span class="nl">betalen, vertrekken, ontmoeten</span> look similar but never split and take no ge- in the participle (<span class="nl">betaald</span>, not <span class="bad">gebetaald</span>). The stress tells them apart.</p></section>`}
];

/* =====================================================
   STATE & STORAGE
   ===================================================== */
let stats = {answered:0, correct:0, byTopic:{}};
async function loadStats(){
  try{ const r = await window.storage.get("dutch-stats"); if(r&&r.value){stats = JSON.parse(r.value);} }catch(e){/* first run */}
  paintHeader();
}
async function saveStats(){
  try{ await window.storage.set("dutch-stats", JSON.stringify(stats)); }catch(e){/* offline ok */}
}
function paintHeader(){
  document.getElementById("hdrAnswered").textContent = stats.answered;
  document.getElementById("hdrAcc").textContent = stats.answered ? Math.round(stats.correct/stats.answered*100)+"%" : "–";
}

let view = {page:"home"};
let session = {n:0, ok:0};
let current = null;
let lastQ = "";

const CNT = counts();
const TOTAL = Object.values(CNT).reduce((a,b)=>a+b,0);
document.getElementById("totalCount").textContent = TOTAL.toLocaleString("en-US")+"+";
document.getElementById("footTotals").textContent = "Question pool: "+TOTAL.toLocaleString("en-US")+" unique combinations across 11 topics.";

/* =====================================================
   RENDERING
   ===================================================== */
const app = document.getElementById("app");

function renderHome(){
  session = {n:0,ok:0};
  let html = `<div class="home-intro"><h2>Pick a topic</h2>
  <p>Read the rules first (Learn), then drill (Practice). Or hit Mixed Practice to be tested on everything at once — that's where real retention happens.</p></div><div class="grid">`;
  for(const t of TOPICS){
    const bt = stats.byTopic[t.id]||{a:0,c:0};
    html += `<div class="tcard"><span class="tab" style="background:${t.color}"></span>
      <h3>${t.title}</h3><p>${t.blurb}</p>
      <div class="meta"><b>${CNT[t.id].toLocaleString("en-US")}</b> questions${bt.a?` · you: ${bt.c}/${bt.a} correct`:""}</div>
      <div class="acts"><button data-learn="${t.id}">Learn</button><button class="go" data-quiz="${t.id}">Practice</button></div></div>`;
  }
  const mixBt = stats.byTopic["mix"]||{a:0,c:0};
  html += `<div class="tcard mixcard"><span class="tab" style="background:var(--yellow)"></span>
    <h3>Mixed Practice</h3><p>Random questions from every topic. Harder, because you don't know which rule is being tested — exactly like real Dutch.</p>
    <div class="meta"><b>${TOTAL.toLocaleString("en-US")}</b> questions${mixBt.a?` · you: ${mixBt.c}/${mixBt.a} correct`:""}</div>
    <div class="acts"><button class="go" data-quiz="mix" style="flex:1">Practice everything</button></div></div>`;
  html += `</div>`;
  app.innerHTML = html;
}

function renderTopic(){
  const t = TOPICS.find(x=>x.id===view.topic);
  const isMix = view.topic==="mix";
  const title = isMix ? "Mixed Practice" : t.title;
  let html = `<div class="topbar"><button class="backbtn" data-home>&larr; Topics</button>
    <span class="topic-title">${title}</span></div>`;
  if(!isMix){
    html += `<div class="tabs">
      <button data-tab="learn" class="${view.tab==="learn"?"on":""}">Learn</button>
      <button data-tab="quiz" class="${view.tab==="quiz"?"on":""}">Practice</button></div>`;
  }
  html += `<div class="pane">`;
  if(!isMix && view.tab==="learn"){
    html += `<div class="learn">${t.learn}<div class="startrow"><button class="bigbtn" data-tab="quiz">Start practising &rarr;</button></div></div>`;
  } else {
    html += `<div class="quiz" id="quizBox"></div>`;
  }
  html += `</div>`;
  app.innerHTML = html;
  if(isMix || view.tab==="quiz") nextQuestion();
}

function makeQuestion(){
  const gen = view.topic==="mix" ? GEN[rnd(Object.keys(GEN))] : GEN[view.topic];
  let q, tries=0;
  do { q = gen(); tries++; } while(q.q===lastQ && tries<5);
  lastQ = q.q;
  return q;
}

function topicLabel(){
  if(view.topic!=="mix") return TOPICS.find(x=>x.id===view.topic).title;
  return "Mixed";
}

function nextQuestion(){
  current = makeQuestion();
  const box = document.getElementById("quizBox");
  const qHtml = esc(current.q).replace(/___/g,'<span class="blank">&nbsp;</span>');
  box.innerHTML = `
    <div class="qmeta"><span>${topicLabel()}</span><span>Session: ${session.ok}/${session.n} correct</span></div>
    <div class="qcard">
      <div class="qtype">Choose the correct answer</div>
      <div class="qtext">${qHtml}</div>
      ${current.hint?`<div class="qhint">${esc(current.hint)}</div>`:""}
      <div class="opts">${current.options.map((o,i)=>`<button data-opt="${i}">${esc(o)}</button>`).join("")}</div>
      <div id="fb"></div>
    </div>
    <div class="scorebar" id="sbar"></div>
    <div class="session">Answered this session: ${session.n}</div>`;
  paintScorebar();
}

function paintScorebar(){
  const bar = document.getElementById("sbar");
  if(!bar) return;
  if(session.n===0){ bar.innerHTML=""; return; }
  const okPct = session.ok/session.n*100;
  bar.innerHTML = `<div class="ok" style="width:${okPct}%"></div><div class="no" style="width:${100-okPct}%"></div>`;
}

function answer(idx){
  const chosen = current.options[idx];
  const isOk = chosen===current.answer;
  session.n++; if(isOk) session.ok++;
  stats.answered++; if(isOk) stats.correct++;
  const key = view.topic;
  stats.byTopic[key] = stats.byTopic[key]||{a:0,c:0};
  stats.byTopic[key].a++; if(isOk) stats.byTopic[key].c++;
  saveStats(); paintHeader(); paintScorebar();

  const box = document.getElementById("quizBox");
  box.querySelectorAll(".opts button").forEach((b,i)=>{
    b.disabled = true;
    const val = current.options[i];
    if(val===current.answer) b.classList.add("correct");
    else if(i===idx) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("fb");
  fb.innerHTML = `<div class="feedback ${isOk?"ok":"no"}">
    <span class="verdict">${isOk?"Correct":"Wrong — the answer is: "+esc(current.answer)}</span>
    ${esc(current.why)}</div>
    <div class="nextrow"><button class="bigbtn" data-next>Next question &rarr;</button></div>`;
  fb.querySelector("[data-next]").focus();
}

/* event delegation */
app.addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  if(b.dataset.home!==undefined){ view={page:"home"}; renderHome(); return; }
  if(b.dataset.learn){ view={page:"topic",topic:b.dataset.learn,tab:"learn"}; renderTopic(); return; }
  if(b.dataset.quiz){ view={page:"topic",topic:b.dataset.quiz,tab:"quiz"}; session={n:0,ok:0}; renderTopic(); return; }
  if(b.dataset.tab){ view.tab=b.dataset.tab; renderTopic(); return; }
  if(b.dataset.opt!==undefined){ answer(+b.dataset.opt); return; }
  if(b.dataset.next!==undefined){ nextQuestion(); return; }
});
document.addEventListener("keydown", e => {
  if(view.page!=="topic") return;
  if(e.key>="1"&&e.key<="4"){
    const btns = app.querySelectorAll(".opts button:not(:disabled)");
    const i = +e.key-1;
    if(btns[i]) btns[i].click();
  }
  if(e.key==="Enter"){
    const nx = app.querySelector("[data-next]");
    if(nx) nx.click();
  }
});

loadStats();
renderHome();
</script>
</body>
</html>
