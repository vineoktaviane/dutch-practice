<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Learn Dutch grammar (A1-B1): simple rules in plain English and thousands of generated practice questions. Works fully offline.">
<meta name="theme-color" content="#e6f3e9">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Dutch Grammar Trainer</title>
</head>
<body>

<header>
  <div class="wrap head-in">
    <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#d1e9db"/>
      <path d="M14 18 h36 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 H26 l-8 8 v-8 h-4 a6 6 0 0 1 -6 -6 V24 a6 6 0 0 1 6 -6 z" fill="#fff" transform="translate(-1,-1)"/>
      <text x="31" y="37" text-anchor="middle" font-family="Manrope,system-ui,sans-serif" font-size="17" font-weight="800" fill="#294b3e">NL</text>
    </svg>
    <div class="head-txt">
      <h1>Dutch Grammar Trainer</h1>
      <div class="head-sub"><span id="topicCount">…</span> topics · a little progress every day<span class="question-count"> · <span class="head-count" id="totalCount">…</span> questions</span></div>
    </div>
    <div class="stat-box">
      <span class="pill"><span class="n" id="hdrAnswered">0</span><span class="l">answered</span></span>
      <span class="pill"><span class="n" id="hdrAcc">-</span><span class="l">accuracy</span></span>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <span>Questions are generated from curated word banks: every noun gender, verb stem and participle is stored explicitly, not guessed.</span>
    <span id="footTotals"></span>
    <button id="installBtn" class="installbtn" hidden>Install app</button>
  </div>
</footer>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
